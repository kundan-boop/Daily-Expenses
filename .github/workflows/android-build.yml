name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Readable versionName (e.g., 1.7)'
        required: false
        default: '1.7'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Verify Package Identity (applicationId)
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APP_ID="com.aistudio.dailyexpense.ledger"
          if ! grep -q "applicationId = \"${EXPECTED_APP_ID}\"" app/build.gradle.kts; then
            echo "::error::applicationId must be ${EXPECTED_APP_ID} in app/build.gradle.kts!"
            exit 1
          fi
          if grep -q "applicationIdSuffix" app/build.gradle.kts; then
            echo "::error::applicationIdSuffix is not allowed in app/build.gradle.kts!"
            exit 1
          fi
          if grep -q "productFlavors" app/build.gradle.kts; then
            echo "::error::productFlavors are not allowed in app/build.gradle.kts!"
            exit 1
          fi
          echo "Verified fixed applicationId=${EXPECTED_APP_ID} (no suffix, no flavors)."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Load or Create Permanent Keystore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ] && [ -n "${SECRET_KEYSTORE_PASSWORD:-}" ] && [ -n "${SECRET_KEY_ALIAS:-}" ] && [ -n "${SECRET_KEY_PASSWORD:-}" ]; then
            echo "Using permanent keystore from GitHub Actions Secrets."
            KEYSTORE_FILE="${{ runner.temp }}/dailyexpense.jks"
            printf '%s' "${SECRET_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > "${KEYSTORE_FILE}"
            if [ ! -s "${KEYSTORE_FILE}" ]; then
              echo "::error::Decoded keystore file is empty."
              exit 1
            fi
            keytool -list -keystore "${KEYSTORE_FILE}" -alias "${SECRET_KEY_ALIAS}" -storepass "${SECRET_KEYSTORE_PASSWORD}" >/dev/null
            echo "CI_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
            echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "${GITHUB_ENV}"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "${GITHUB_ENV}"
          else
            PRIVATE=$(gh api "repos/${{ github.repository }}" --jq .private 2>/dev/null || echo "unknown")
            if [ "${PRIVATE}" = "true" ]; then
              mkdir -p signing
              REPO_KS="${GITHUB_WORKSPACE}/signing/dailyexpense.jks"
              REPO_PASS_FILE="${GITHUB_WORKSPACE}/signing/keystore-password.txt"

              if [ ! -f "${REPO_KS}" ] || [ ! -s "${REPO_PASS_FILE}" ]; then
                echo "Creating permanent signing keystore in signing/dailyexpense.jks (one-time)..."
                PASS=$(openssl rand -hex 16)
                echo "::add-mask::${PASS}"
                rm -f "${REPO_KS}"
                keytool -genkeypair -v \
                  -keystore "${REPO_KS}" \
                  -alias dailyexpense \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass "${PASS}" -keypass "${PASS}" \
                  -dname "CN=Daily Expenses Ledger, O=DailyExpense, C=IN"
                printf '%s' "${PASS}" > "${REPO_PASS_FILE}"

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add signing/dailyexpense.jks signing/keystore-password.txt
                git commit -m "chore: add permanent signing keystore [skip ci]"
                if ! (git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"); then
                  echo "::error::Could not push signing/dailyexpense.jks to the repository. Enable 'Read and write permissions' under Settings -> Actions -> General -> Workflow permissions, then re-run."
                  exit 1
                fi
                echo "Created and saved permanent keystore in signing/dailyexpense.jks." >> "${GITHUB_STEP_SUMMARY}"
              else
                echo "Reusing existing permanent keystore from signing/dailyexpense.jks."
              fi

              PASS=$(tr -d '\r\n' < "${REPO_PASS_FILE}")
              echo "::add-mask::${PASS}"
              keytool -list -keystore "${REPO_KS}" -alias dailyexpense -storepass "${PASS}" >/dev/null
              echo "CI_KEYSTORE_PATH=${REPO_KS}" >> "${GITHUB_ENV}"
              echo "KEYSTORE_PASSWORD=${PASS}" >> "${GITHUB_ENV}"
              echo "KEY_ALIAS=dailyexpense" >> "${GITHUB_ENV}"
              echo "KEY_PASSWORD=${PASS}" >> "${GITHUB_ENV}"
            elif [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
              echo "::notice::Public repository without GitHub Secrets: signing consistently with repository debug.keystore.base64 so every APK shares the exact same certificate (matching AI Studio builds). For Play Store / private release signing, add the 4 signing secrets or make the repo private."
              KEYSTORE_FILE="${{ runner.temp }}/dailyexpense.jks"
              tr -d '\r\n ' < "${GITHUB_WORKSPACE}/debug.keystore.base64" | base64 --decode > "${KEYSTORE_FILE}"
              if [ ! -s "${KEYSTORE_FILE}" ]; then
                echo "::error::Decoded debug.keystore.base64 is empty."
                exit 1
              fi
              keytool -list -keystore "${KEYSTORE_FILE}" -alias androiddebugkey -storepass android >/dev/null
              echo "CI_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
              echo "KEYSTORE_PASSWORD=android" >> "${GITHUB_ENV}"
              echo "KEY_ALIAS=androiddebugkey" >> "${GITHUB_ENV}"
              echo "KEY_PASSWORD=android" >> "${GITHUB_ENV}"
            else
              echo "::notice::Public repository without GitHub Secrets and debug.keystore.base64 omitted from GitHub export: decoding consistent AI Studio debug certificate (SHA-1 80:FE:43:A8:...) so updates install in-place and Google Sign-In matches google-services.json."
              KEYSTORE_FILE="${{ runner.temp }}/dailyexpense.jks"
              B64_FALLBACK=''
              printf '%s' "${B64_FALLBACK}" | base64 --decode > "${KEYSTORE_FILE}"
              if [ ! -s "${KEYSTORE_FILE}" ]; then
                echo "::error::Decoded fallback keystore is empty."
                exit 1
              fi
              keytool -list -keystore "${KEYSTORE_FILE}" -alias androiddebugkey -storepass android >/dev/null
              echo "CI_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
              echo "KEYSTORE_PASSWORD=android" >> "${GITHUB_ENV}"
              echo "KEY_ALIAS=androiddebugkey" >> "${GITHUB_ENV}"
              echo "KEY_PASSWORD=android" >> "${GITHUB_ENV}"
            fi
          fi

      - name: Compute Monotonic Version Code & Version Name
        shell: bash
        run: |
          set -euo pipefail
          EPOCH_MINUTES=$(( $(date +%s) / 60 ))
          INPUT_VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "${INPUT_VERSION_NAME}" ]; then
            INPUT_VERSION_NAME=$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]*=/{print $2; exit}' app/build.gradle.kts || echo "1.6")
          fi
          echo "VERSION_CODE=${EPOCH_MINUTES}" >> "${GITHUB_ENV}"
          echo "VERSION_NAME=${INPUT_VERSION_NAME}" >> "${GITHUB_ENV}"
          echo "Resolved VERSION_CODE=${EPOCH_MINUTES}, VERSION_NAME=${INPUT_VERSION_NAME}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Apply Fallback VersionCode if signing.gradle Missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/signing.gradle ] || ! grep -q "signing.gradle" app/build.gradle.kts; then
            echo "signing.gradle not linked; patching versionCode=${VERSION_CODE} directly for this CI build."
            sed -i -E "s/versionCode(\s*=\s*|\s+)[0-9]+/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          fi

      - name: Build Universal APK
        run: |
          set -euo pipefail
          if [ -f app/signing.gradle ] && grep -q "signing.gradle" app/build.gradle.kts; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Verify, Ensure Permanent Signature & Print Summary
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
          else
            SRC_APK=$(find app/build/outputs/apk -name '*.apk' -print -quit || true)
          fi
          if [ -z "${SRC_APK}" ] || [ ! -f "${SRC_APK}" ]; then
            echo "::error::No built APK found under app/build/outputs/apk"
            exit 1
          fi

          OUT_DIR="${{ runner.temp }}/apk-out"
          mkdir -p "${OUT_DIR}"
          OUT_APK="${OUT_DIR}/DailyExpense-v${VERSION_NAME}-${GITHUB_RUN_NUMBER}.apk"

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR=$(ls -d "${SDK_DIR}"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"

          if [ -f app/signing.gradle ] && grep -q "signing.gradle" app/build.gradle.kts; then
            cp "${SRC_APK}" "${OUT_APK}"
          else
            "${ZIPALIGN}" -p -f 4 "${SRC_APK}" "${OUT_DIR}/aligned.apk"
            "${APKSIGNER}" sign \
              --ks "${CI_KEYSTORE_PATH}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "${OUT_APK}" "${OUT_DIR}/aligned.apk"
            rm -f "${OUT_DIR}/aligned.apk"
          fi

          echo "=== APK Package Metadata ==="
          PKG_LINE=""
          if [ -x "${AAPT2}" ]; then
            PKG_LINE=$("${AAPT2}" dump badging "${OUT_APK}" | grep -E "^package:" || true)
            echo "${PKG_LINE}"
            if ! echo "${PKG_LINE}" | grep -q "name='com.aistudio.dailyexpense.ledger'"; then
              echo "::error::Built APK package name does not match com.aistudio.dailyexpense.ledger!"
              exit 1
            fi
          fi

          echo "=== APK Signing Certificate Fingerprint ==="
          "${APKSIGNER}" verify --verbose --print-certs "${OUT_APK}" | tee /tmp/apksigner_verify.txt
          SHA_LINE=$(grep -i "SHA-256" /tmp/apksigner_verify.txt || true)

          {
            echo "### Build Result"
            echo "${PKG_LINE}"
            echo "${SHA_LINE}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup Temp Keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/dailyexpense.jks"

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: DailyExpense-v${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: ${{ runner.temp }}/apk-out/DailyExpense-*.apk
          retention-days: 14
